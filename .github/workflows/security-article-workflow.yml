name: Security Article Workflow

on:
  schedule:
    # Run daily at 6 AM eastern, mon and thurs
    - cron: "0 11 * * 1,4"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read # To checkout code

jobs:
  fetch-articles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run security article workflow
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          python security_article_workflow.py

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-articles-${{ github.run_id }}
          path: |
            security_post_*.json

      - name: Extract and display LinkedIn post
        shell: python
        run: |
          import json
          import glob
          import os

          # Write header to summary
          summary_path = os.environ['GITHUB_STEP_SUMMARY']
          with open(summary_path, 'a') as f:
              f.write("## LinkedIn Post Generated\n\n")

          files = glob.glob('security_post_*.json')
          if files:
              # Find latest file
              latest_file = max(files, key=os.path.getmtime)
              
              with open(latest_file, 'r') as f:
                  data = json.load(f)
              
              # Write content to summary
              with open(summary_path, 'a') as f:
                  f.write(data.get('linkedin_post', 'No post generated'))
                  f.write('\n\n---\n\n')
                  f.write(f"**Total Articles Found:** {data.get('total_articles_found', 0)}\n")
                  f.write(f"**Articles Selected:** {len(data.get('selected_articles', []))}\n")
                  f.write('\n### Selected Articles:\n')
                  
                  for i, article in enumerate(data.get('selected_articles', []), 1):
                      f.write(f"{i}. [{article['title']}]({article['url']})\n")
                      f.write(f"   - Source: {article['source']}\n")
                      f.write(f"   - Published: {article['published']}\n")
